<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نتائج التلاميذ</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      direction: rtl;
      background: linear-gradient(to left, #eef2f3, #f8f9fa);
      padding: 20px;
      margin: 0;
    }

    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
      font-size: 24px;
    }

    .search-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    input[type="text"] {
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      width: 100%;
      max-width: 300px;
    }

    button {
      padding: 12px 25px;
      font-size: 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0056b3;
    }

    #result {
      margin-top: 30px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    th, td {
      padding: 14px 10px;
      text-align: center;
      border-bottom: 1px solid #eee;
    }

    th {
      background-color: #343a40;
      color: white;
    }

    .not-found {
      text-align: center;
      color: red;
      font-weight: bold;
      font-size: 18px;
    }

    @media (max-width: 600px) {
      h2 {
        font-size: 20px;
      }

      input[type="text"], button {
        width: 90%;
      }

      table th, table td {
        font-size: 14px;
        padding: 10px;
      }
    }
  </style>
</head>
<body>

  <h2>البحث عن نتائج التلميذ</h2>

  <div class="search-container">
    <input type="text" id="searchNNi" placeholder="أدخل رقم NNi">
    <button onclick="search()">بحث</button>
  </div>

  <div id="result"></div>

  <script>
    async function search() {
      const input = document.getElementById("searchNNi").value.trim();
      const resultDiv = document.getElementById("result");

      try {
        const response = await fetch("data.json");
        const data = await response.json();

        const student = data.find(item => item.NNi === input);

        if (student) {
          resultDiv.innerHTML = `
            <table>
              <tr>
                <th>NNi</th>
                <th>الإسم الكامل</th>
                <th>تاريخ الميلاد</th>
                <th>رقم التلميذ</th>
                <th>المعدل العام</th>
                <th>القرار</th>
              </tr>
              <tr>
                <td>${student.NNi}</td>
                <td>${student.NOMPL}</td>
                <td>${student.DATN}</td>
                <td>${student.NODOSS}</td>
                <td>${student.MOYG}</td>
                <td>${student.decision}</td>
              </tr>
            </table>
          `;
        } else {
          resultDiv.innerHTML = `<div class="not-found">لم يتم العثور على التلميذ بهذا الرقم.</div>`;
        }
      } catch (error) {
        resultDiv.innerHTML = `<div class="not-found">حدث خطأ أثناء تحميل البيانات.</div>`;
        console.error(error);
      }
    }
  </script>

</body>
</html>
