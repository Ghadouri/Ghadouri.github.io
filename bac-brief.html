<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نتائج التلاميذ</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Cairo', sans-serif;
    }

    body {
      direction: rtl;
      margin: 0;
      padding: 20px;
      background: linear-gradient(to left, #e0ecf8, #f9f9f9);
      color: #333;
    }

    h2 {
      text-align: center;
      font-size: 26px;
      color: #2c3e50;
      margin-bottom: 30px;
    }

    .search-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 25px;
    }

    input[type="text"] {
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      width: 100%;
      max-width: 300px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #2980b9;
    }

    #result {
      margin-top: 25px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    }

    th, td {
      padding: 14px 10px;
      text-align: center;
      border-bottom: 1px solid #f0f0f0;
    }

    th {
      background-color: #2c3e50;
      color: white;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .not-found {
      text-align: center;
      color: #e74c3c;
      font-weight: bold;
      font-size: 18px;
      margin-top: 20px;
    }

    @media (max-width: 600px) {
      h2 {
        font-size: 22px;
      }

      input, button {
        width: 90%;
      }

      table th, table td {
        font-size: 14px;
        padding: 10px;
      }
    }
  </style>
</head>
<body>

  <h2>البحث عن نتائج التلميذ</h2>

  <div class="search-container">
    <input type="text" id="searchNODOSS" placeholder="أدخل رقم التلميذ">
    <button onclick="search()">بحث</button>
  </div>

  <div id="result"></div>

  <script>
    function formatDate(timestamp) {
      const date = new Date(timestamp);
      return date.toISOString().split('T')[0];
    }

    async function search() {
      const input = document.getElementById("searchNODOSS").value.trim();
      const resultDiv = document.getElementById("result");

      try {
        const response = await fetch("data.json");
        const data = await response.json();

        const student = data.find(item => item.Num_Bepc.toString() === input);

        if (student) {
          resultDiv.innerHTML = `
            <table>
              <tr>
                <th>رقم التلميذ</th>
                <th>الإسم الكامل</th>
                <th>تاريخ الميلاد</th>
                <th>مكان الميلاد</th>
                <th>الولاية</th>
                <th>المدرسة</th>
                <th>المركز</th>
                <th>المعدل</th>
                <th>القرار</th>
              </tr>
              <tr>
                <td>${student.Num_Bepc}</td>
                <td>${student.NOM}</td>
                <td>${formatDate(student.DATE_NAISS)}</td>
                <td>${student.LIEU_NAIS}</td>
                <td>${student.WILAYA}</td>
                <td>${student.Ecole}</td>
                <td>${student.Centre}</td>
                <td>${student.Moyenne_Bepc}</td>
                <td>${student.Decision}</td>
              </tr>
            </table>
          `;
        } else {
          resultDiv.innerHTML = `<div class="not-found">لم يتم العثور على التلميذ بهذا الرقم.</div>`;
        }
      } catch (error) {
        resultDiv.innerHTML = `<div class="not-found">حدث خطأ أثناء تحميل البيانات.</div>`;
        console.error(error);
      }
    }
  </script>

</body>
</html>
