<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>نتائج كونكور</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Cairo', sans-serif;
    }
    body {
      background: linear-gradient(135deg, #ffecd2, #fcb69f);
      direction: rtl;
      padding: 20px;
      margin: 0;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #d35400;
      font-size: 28px;
      margin-bottom: 30px;
    }
    select, .student-list button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      font-size: 17px;
      border-radius: 10px;
      border: 1px solid #ccc;
      outline: none;
      transition: border 0.3s ease;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      cursor: pointer;
    }
    .student-list {
      margin-top: 20px;
    }
    .student-list button {
      background-color: white;
      margin-bottom: 10px;
      text-align: right;
    }
    .student-list button:hover {
      background-color: #fcd5b5;
    }
    @media (max-width: 600px) {
      h1 {
        font-size: 22px;
      }
      select, .student-list button {
        font-size: 16px;
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <h1>نتائج كونكور</h1>

  <select id="schoolSelect">
    <option value="">اختر المدرسة</option>
  </select>

  <div class="student-list" id="studentList"></div>

  <script>
    let data = [];

    fetch('total_nom_ar.json')
      .then(response => response.json())
      .then(json => {
        data = json;

        // ملء المدارس
        const schools = [...new Set(data.map(item => item.ECOLE))];
        const schoolSelect = document.getElementById('schoolSelect');

        schools.forEach(school => {
          const option = document.createElement('option');
          option.value = school;
          option.textContent = school;
          schoolSelect.appendChild(option);
        });
      });

    document.getElementById('schoolSelect').addEventListener('change', function () {
      const selectedSchool = this.value;
      const studentList = document.getElementById('studentList');
      studentList.innerHTML = '';

      const filtered = data.filter(item => item.ECOLE === selectedSchool);

      filtered.forEach(student => {
        const btn = document.createElement('button');
        btn.textContent = student.NOM_AR;
        btn.onclick = () => {
          // حفظ في localStorage وفتح صفحة التفاصيل
          localStorage.setItem('student', JSON.stringify(student));
          window.location.href = 'details.html';
        };
        studentList.appendChild(btn);
      });
    });
  </script>
</body>
</html>
